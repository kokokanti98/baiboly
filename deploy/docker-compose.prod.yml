version: '3.8'

services:
  db:
    image: postgres:13-alpine
    container_name: baiboly-db-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baiboly}
      POSTGRES_USER: ${POSTGRES_USER:-baiboly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - baiboly-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-baiboly} -d ${POSTGRES_DB:-baiboly}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: baiboly-backend-prod
    environment:
      FLASK_APP: src/app.py
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-baiboly}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-baiboly}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://votredomaine.com}
      BABEL_DEFAULT_LOCALE: mg
      BABEL_DEFAULT_TIMEZONE: Indian/Antananarivo
    depends_on:
      db:
        condition: service_healthy
    networks:
      - baiboly-network
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs:/app/logs
    command: >
      sh -c "
        flask db upgrade &&
        gunicorn --bind 0.0.0.0:5000 --workers 4 --timeout 120 'src.app:create_app()'
      "

networks:
  baiboly-network:
    driver: bridge

volumes:
  postgres_data:


