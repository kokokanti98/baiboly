version: '3.8'

services:
  db:
    image: postgres:13
    container_name: baiboly-db-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baiboly}
      POSTGRES_USER: ${POSTGRES_USER:-baiboly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - baiboly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-baiboly}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: baiboly-backend-prod
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-baiboly}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-baiboly}
      SECRET_KEY: ${SECRET_KEY}
      FLASK_APP: src.app:create_app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - baiboly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./logs:/app/logs

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: baiboly-frontend-prod
    networks:
      - baiboly-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: baiboly-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
      - frontend
    networks:
      - baiboly-network
    restart: unless-stopped

networks:
  baiboly-network:
    driver: bridge

volumes:
  postgres_data:
  nginx_cache:
