<VirtualHost *:80>
    ServerName baiboly-fihirana.mnsite.ovh
    ServerAlias www.baiboly-fihirana.mnsite.ovh
    ServerAdmin admin@baiboly-fihirana.mnsite.ovh
    
    # Document Root - Frontend Static Files
    DocumentRoot /var/www/html/baiboly
    
    <Directory /var/www/html/baiboly>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # SPA Routing - Redirect all requests to index.html
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>
    
    # Proxy API requests to Backend Docker
    ProxyPreserveHost On
    ProxyPass /api http://localhost:5000/api
    ProxyPassReverse /api http://localhost:5000/api
    
    # Compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>
    
    # Browser Caching for Static Assets
    <IfModule mod_expires.c>
        ExpiresActive On
        
        # Images
        ExpiresByType image/jpeg "access plus 1 year"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/gif "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
        ExpiresByType image/webp "access plus 1 year"
        ExpiresByType image/x-icon "access plus 1 year"
        
        # CSS and JavaScript
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType text/javascript "access plus 1 month"
        
        # Fonts
        ExpiresByType font/woff "access plus 1 year"
        ExpiresByType font/woff2 "access plus 1 year"
        ExpiresByType application/font-woff "access plus 1 year"
        ExpiresByType application/font-woff2 "access plus 1 year"
        
        # HTML (no caching for SPA)
        ExpiresByType text/html "access plus 0 seconds"
    </IfModule>
    
    # Logging
    ErrorLog ${APACHE_LOG_DIR}/baiboly-error.log
    CustomLog ${APACHE_LOG_DIR}/baiboly-access.log combined
    
    # Limit request size (adjust as needed)
    LimitRequestBody 10485760
</VirtualHost>

