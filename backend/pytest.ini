[pytest]
# Pytest configuration for Baiboly backend tests
# Constitutional requirement: ≥80% test coverage

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum required coverage: 80%
# Use: pytest --cov=src --cov-report=html --cov-report=term
addopts =
    --verbose
    --strict-markers
    --tb=short
    --cov=src
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80

# Markers for organizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (database, API endpoints)
    slow: Slow tests (can be skipped during rapid development)
    search: Full-text search tests
    bible: Bible-related tests
    fihirana: Fihirana-related tests

# Coverage options
[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov
